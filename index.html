<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompt Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#14213d;--mute:#5b6783;--line:#d5dbe7;--acc:#2f5bff;--accink:#fff;--out:#0f1830;--outink:#dfe7ff;--ok:#12805c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--panel:#141c30;--ink:#e8edfb;--mute:#93a0bf;--line:#26314d;--acc:#6f8dff;--accink:#0c1220;--out:#080d19;--outink:#dfe7ff;--ok:#3ccf9b}}
:root[data-theme="dark"]{--bg:#0c1220;--panel:#141c30;--ink:#e8edfb;--mute:#93a0bf;--line:#26314d;--acc:#6f8dff;--accink:#0c1220;--out:#080d19;--outink:#dfe7ff;--ok:#3ccf9b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
header{max-width:1180px;margin:0 auto;padding:28px 20px 8px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
h1{font-size:clamp(28px,5vw,44px);line-height:1.05;letter-spacing:-.02em;max-width:16ch}
header p{margin:10px 0 0;color:var(--mute);max-width:46ch}
button,select,input,textarea{font:inherit;color:inherit}
.theme{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:16px 20px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.out{position:sticky;top:16px;background:var(--out);color:var(--outink);border-radius:14px;padding:18px}
@media(max-width:860px){.out{position:static}}
label{display:block;font-weight:500;margin:18px 0 6px}
label small{font-weight:400;color:var(--mute);margin-left:6px}
input[type=text],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;margin:0;font-weight:400}
.checks input{margin-top:5px;accent-color:var(--acc)}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.meter{flex:1;height:8px;background:#ffffff22;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.tip{font-size:14px;color:#aab7dc;margin:0 0 12px;min-height:21px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;max-height:62vh;overflow:auto;padding:14px;background:#ffffff0d;border-radius:10px}
.act{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.act button{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:500}
.primary{background:var(--acc);color:var(--accink)}
.ghost{background:#ffffff1a;color:var(--outink)}
.empty{color:#8f9cc2}
[hidden]{display:none!important}.tabs{margin-bottom:6px}.help{color:var(--mute);margin:0 0 4px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Build a better AI prompt</h1>
    <p>Answer a few questions. Your prompt assembles on the right as you type.</p>
  </div>
  <button class="theme" id="theme" type="button">Dark / light</button>
</header>
<main>
  <section class="form" aria-label="Prompt details">
    <div class="chips tabs" id="modes" role="group" aria-label="Mode">
      <button type="button" data-m="text" aria-pressed="true">Text prompt</button>
      <button type="button" data-m="image" aria-pressed="false">Image prompt</button>
      <button type="button" data-m="improve" aria-pressed="false">Improve a draft</button>
    </div>
    <div id="m-text">
    <label id="tl">What do you need?</label>
    <div class="chips" role="group" aria-labelledby="tl" id="types"></div>

    <div class="row">
      <div><label for="target">Which AI?</label>
        <select id="target"><option>ChatGPT</option><option>Claude</option><option>Gemini</option><option>Any AI</option></select></div>
      <div><label for="role">Who should the AI be?<small>role</small></label>
        <input type="text" id="role" placeholder="e.g. senior product marketer"></div>
    </div>

    <label for="goal">What exactly do you want done?<small>required</small></label>
    <textarea id="goal" placeholder="e.g. Write a launch email for our new budgeting app"></textarea>

    <label for="context">Background the AI should know<small>optional</small></label>
    <textarea id="context" placeholder="Product, situation, data, what you already tried"></textarea>

    <div class="row">
      <div><label for="audience">Who is it for?</label>
        <input type="text" id="audience" placeholder="e.g. freelancers in Nigeria"></div>
      <div><label for="tone">Tone</label>
        <select id="tone"><option value="">No preference</option><option>Professional</option><option>Friendly</option><option>Persuasive</option><option>Simple and plain</option><option>Technical</option><option>Playful</option></select></div>
    </div>

    <div class="row">
      <div><label for="format">Answer format</label>
        <select id="format"><option value="">No preference</option><option>Short paragraphs</option><option>Bullet points</option><option>Step-by-step list</option><option>Table</option><option>Code block</option><option>JSON</option></select></div>
      <div><label for="length">Length</label>
        <input type="text" id="length" placeholder="e.g. under 150 words"></div>
    </div>

    <label for="rules">Rules and limits<small>one per line</small></label>
    <textarea id="rules" placeholder="Avoid jargon&#10;Do not mention competitors"></textarea>

    <label for="example">Example of a good result<small>optional</small></label>
    <textarea id="example" placeholder="Paste a sample the AI should imitate"></textarea>

    <label>Extra techniques</label>
    <div class="checks" id="tech"></div>
    </div>
    <div id="m-image" hidden>
      <div class="row">
        <div><label for="itarget">Which generator?</label><select id="itarget"><option>Midjourney</option><option>DALL·E / ChatGPT</option><option>Stable Diffusion</option><option>Any generator</option></select></div>
        <div><label for="iar">Aspect ratio</label><select id="iar"><option>1:1</option><option>16:9</option><option>9:16</option><option>4:3</option><option>3:2</option></select></div>
      </div>
      <label for="isubject">What is in the image?<small>required</small></label>
      <textarea id="isubject" placeholder="e.g. a street vendor grilling suya at dusk, steam rising"></textarea>
      <div class="row">
        <div><label for="istyle">Style</label><select id="istyle"><option value="">No preference</option><option value="photorealistic">photorealistic</option><option value="cinematic film">cinematic film</option><option value="watercolor">watercolor</option><option value="3D render">3D render</option><option value="flat vector illustration">flat vector illustration</option><option value="anime">anime</option><option value="oil painting">oil painting</option><option value="pencil sketch">pencil sketch</option></select></div>
        <div><label for="ilight">Lighting</label><select id="ilight"><option value="">No preference</option><option value="golden hour">golden hour</option><option value="soft studio">soft studio</option><option value="dramatic backlight">dramatic backlight</option><option value="neon night">neon night</option><option value="overcast daylight">overcast daylight</option></select></div>
      </div>
      <div class="row">
        <div><label for="icomp">Camera and framing</label><select id="icomp"><option value="">No preference</option><option value="close-up portrait">close-up portrait</option><option value="wide establishing shot">wide establishing shot</option><option value="aerial view">aerial view</option><option value="low angle">low angle</option><option value="macro detail">macro detail</option><option value="centered symmetrical">centered symmetrical</option></select></div>
        <div><label for="imood">Mood</label><input type="text" id="imood" placeholder="e.g. warm, nostalgic"></div>
      </div>
      <label for="icolors">Colors</label><input type="text" id="icolors" placeholder="e.g. deep orange and teal">
      <label for="iavoid">Leave out<small>optional</small></label><input type="text" id="iavoid" placeholder="e.g. text, watermark, extra fingers">
    </div>
    <div id="m-improve" hidden>
      <p class="help">Paste a prompt you already use. I will spot what is missing and ask.</p>
      <label for="draft">Your draft prompt<small>required</small></label>
      <textarea id="draft" style="min-height:140px" placeholder="e.g. Write a blog post about remote work"></textarea>
      <div id="qs"></div>
    </div>
  </section>

  <aside class="out" aria-label="Generated prompt">
    <div class="bar"><strong id="score">0%</strong><div class="meter"><i id="fill"></i></div></div>
    <p class="tip" id="tip"></p>
    <pre id="prompt" aria-live="polite"></pre>
    <div class="act">
      <button class="primary" id="copy" type="button">Copy prompt</button>
      <button class="ghost" id="reset" type="button">Clear all</button>
    </div>
  </aside>
</main>
<script>
var TYPES=["Write","Code","Analyze","Summarize","Brainstorm","Explain / teach","Edit / improve"];
var TECH=[["steps","Think step by step before answering"],["ask","Ask me clarifying questions before starting"],["check","Review the answer against my rules before sending"],["assume","List any assumptions you made"]];
var TECHTXT={steps:"Think through the problem step by step before giving your final answer.",ask:"If anything is unclear or missing, ask me up to 3 clarifying questions before you start.",check:"Before replying, check your draft against every rule above and fix any mismatch.",assume:"State any assumptions you made at the end."};
var mode="text",ans={},qkey="",type="Write",$=function(i){return document.getElementById(i)};
var ids=["target","role","goal","context","audience","tone","format","length","rules","example"];

(function init(){
  var t=$("types");
  TYPES.forEach(function(n){var b=document.createElement("button");b.type="button";b.textContent=n;b.setAttribute("aria-pressed",n===type);
    b.onclick=function(){type=n;[].forEach.call(t.children,function(c){c.setAttribute("aria-pressed",c===b)});render()};t.appendChild(b)});
  var c=$("tech");
  TECH.forEach(function(x){var l=document.createElement("label");l.innerHTML='<input type="checkbox" value="'+x[0]+'"> <span>'+x[1]+'</span>';c.appendChild(l)});
  document.querySelector(".form").addEventListener("input",render);
  document.querySelector(".form").addEventListener("change",render);
  render();
})();

function v(i){return $(i).value.trim()}
function sec(name,body,xml){return xml?"<"+name+">\n"+body+"\n</"+name+">":"## "+name.charAt(0).toUpperCase()+name.slice(1)+"\n"+body}

function buildText(){
  var xml=v("target")==="Claude",parts=[];
  var role=v("role"),goal=v("goal");
  var intro="You are "+(role?(/^[aeiou]/i.test(role)?"an ":"a ")+role:"a helpful expert")+". Your job is to help with a \""+type.toLowerCase()+"\" task.";
  parts.push(intro);
  if(goal)parts.push(sec("task",goal,xml));
  if(v("context"))parts.push(sec("context",v("context"),xml));
  var spec=[];
  if(v("audience"))spec.push("- Audience: "+v("audience"));
  if(v("tone"))spec.push("- Tone: "+v("tone"));
  if(v("format"))spec.push("- Format: "+v("format"));
  if(v("length"))spec.push("- Length: "+v("length"));
  if(spec.length)parts.push(sec("output requirements",spec.join("\n"),xml));
  var rules=v("rules").split("\n").map(function(s){return s.trim()}).filter(Boolean);
  if(rules.length)parts.push(sec("rules",rules.map(function(r){return "- "+r}).join("\n"),xml));
  if(v("example"))parts.push(sec("example",v("example"),xml));
  var tech=[].filter.call(document.querySelectorAll("#tech input:checked"),function(){return true}).map(function(i){return TECHTXT[i.value]});
  if(tech.length)parts.push(tech.join(" "));
  return parts.join("\n\n");
}

function renderText(){
  var goal=v("goal"),p=$("prompt");
  if(!goal){p.innerHTML='<span class="empty">Start with "What exactly do you want done?" and your prompt will appear here.</span>'}
  else p.textContent=build();
  var checks=[["role",v("role")],["goal",goal],["context",v("context")],["audience",v("audience")],["tone/format",v("tone")||v("format")],["length",v("length")],["rules",v("rules")],["example",v("example")]];
  var w=[1,3,2,1,1,1,2,1],tot=12,got=0,miss=null;
  checks.forEach(function(c,i){if(c[1])got+=w[i];else if(!miss&&w[i]>=2)miss=c[0]});
  var pct=Math.round(got/tot*100);$("score").textContent=pct+"%";$("fill").style.width=pct+"%";
  $("tip").textContent=!goal?"Describe the task first.":miss?"Stronger if you add: "+miss+".":pct>=80?"Detailed prompt. Ready to use.":"Add an audience or length to sharpen the answer.";
}

var QS=[
["role","Who should the AI act as?","e.g. senior data analyst",/you are|act as|role:/i],
["context","What background should it know?","Situation, product, data",/^\s*(\S+\s+){24}\S+/],
["audience","Who is the result for?","e.g. busy managers",/audience|for (beginners|students|customers|kids|managers|developers|readers|clients)/i],
["tone","What tone do you want?","e.g. friendly and direct",/\btone\b|formal|casual|friendly|professional|persuasive|playful|technical/i],
["format","What format should the answer take?","e.g. bullet points, table",/bullet|table|json|list|paragraph|markdown|format|steps/i],
["length","How long should it be?","e.g. under 200 words",/\d+\s*(words|sentences|paragraphs|lines|characters)|short|brief|concise|detailed/i],
["rules","Anything it must avoid or always do?","One rule per line",/avoid|don't|do not|never|must|only|without/i],
["example","Do you have an example of a good result?","Paste a short sample",/example|e\.g\.|for instance|such as/i]];
function show(t,e,pct,tip){var p=$("prompt");if(t)p.textContent=t;else p.innerHTML='<span class="empty">'+e+'</span>';$("score").textContent=pct+"%";$("fill").style.width=pct+"%";$("tip").textContent=tip}
function build(){return mode==="text"?(v("goal")?buildText():""):mode==="image"?buildImg():buildImp()}
function render(){if(mode==="text")return renderText();if(mode==="image")return renderImg();renderImp()}
function buildImg(){
  var s=v("isubject");if(!s)return"";
  var ar=v("iar"),av=v("iavoid"),t=v("itarget");
  var b=[s,v("istyle")&&v("istyle")+" style",v("imood")&&v("imood")+" mood",v("ilight")&&v("ilight")+" lighting",v("icomp"),v("icolors")&&v("icolors")+" color palette"].filter(Boolean).join(", ");
  if(t==="Midjourney")return b+" --ar "+ar+(av?" --no "+av:"");
  if(t==="DALL·E / ChatGPT")return "Create an image: "+b+".\nAspect ratio "+ar+"."+(av?"\nDo not include: "+av+".":"");
  if(t==="Stable Diffusion")return b+", highly detailed, sharp focus"+(av?"\nNegative prompt: "+av:"")+"\nAspect ratio: "+ar;
  return b+"\nAspect ratio: "+ar+(av?"\nAvoid: "+av:"");
}
function renderImg(){
  var f=[["isubject",4,"a subject"],["istyle",2,"a style"],["ilight",1,"lighting"],["icomp",1,"camera framing"],["imood",1,"a mood"],["icolors",1,"colors"],["iavoid",1,"things to leave out"]],got=0,miss=null;
  f.forEach(function(x){if(v(x[0]))got+=x[1];else if(!miss)miss=x[2]});
  var pct=Math.round(got/11*100);
  show(buildImg(),'Describe what is in the image and your prompt will appear here.',pct,!v("isubject")?"Describe the subject first.":miss?"Stronger if you add: "+miss+".":"Detailed prompt. Ready to use.");
}
function buildImp(){
  var d=v("draft");if(!d)return"";
  var a=function(k){return ans[k]||""},o=(a("role")?"You are "+a("role")+".\n\n":"")+d;
  if(a("context"))o+="\n\n## Context\n"+a("context");
  var r=[["Audience","audience"],["Tone","tone"],["Format","format"],["Length","length"]].filter(function(x){return a(x[1])}).map(function(x){return "- "+x[0]+": "+a(x[1])});
  if(r.length)o+="\n\n## Output requirements\n"+r.join("\n");
  if(a("rules"))o+="\n\n## Rules\n"+a("rules").split("\n").filter(Boolean).map(function(x){return "- "+x}).join("\n");
  if(a("example"))o+="\n\n## Example of a good result\n"+a("example");
  return o;
}
function renderImp(){
  var d=v("draft");
  [].forEach.call(document.querySelectorAll("#qs input"),function(i){ans[i.dataset.k]=i.value.trim()});
  var miss=d?QS.filter(function(q){return !q[3].test(d)}):[],k=miss.map(function(q){return q[0]}).join();
  if(k!==qkey){qkey=k;$("qs").innerHTML=miss.map(function(q){return '<label>'+q[1]+'<small>optional</small><input type="text" data-k="'+q[0]+'" placeholder="'+q[2]+'"></label>'}).join("");
    [].forEach.call(document.querySelectorAll("#qs input"),function(i){i.value=ans[i.dataset.k]||""})}
  var done=d?QS.filter(function(q){return q[3].test(d)||ans[q[0]]}).length:0,left=QS.length-done;
  show(buildImp(),'Paste your draft and the questions will appear here.',Math.round(done/QS.length*100),!d?"Paste a draft first.":left?left+" gap"+(left>1?"s":"")+" left. Answer what matters, skip the rest.":"Nothing obvious is missing.");
}
document.getElementById("modes").addEventListener("click",function(e){
  var m=e.target.getAttribute&&e.target.getAttribute("data-m");if(!m)return;mode=m;
  [].forEach.call(this.children,function(b){b.setAttribute("aria-pressed",b===e.target)});
  ["text","image","improve"].forEach(function(x){$("m-"+x).hidden=x!==m});render();
});
$("copy").onclick=function(){
  var t=build(),b=$("copy");if(!t)return;
  function done(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy prompt"},1500)}
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}
  function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}a.remove()}
};
$("reset").onclick=function(){
  ans={};[].forEach.call(document.querySelectorAll(".form input[type=text],.form textarea,.form select"),function(e){e.value=e.tagName==="SELECT"?e.options[0].value:""});
  [].forEach.call(document.querySelectorAll("#tech input"),function(c){c.checked=false});render();
};
$("theme").onclick=function(){
  var r=document.documentElement,d=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  r.setAttribute("data-theme",d==="dark"?"light":"dark");
};
</script>
</body>
</html>
